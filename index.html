              <span>${s}</span>
            </div>`).join("")}
        </div>

        <p class="modal-desc">${esc(report.description)}</p>

        <div class="modal-photo">
          ${report.hasPhoto
            ? `<div class="photo-placeholder">${icon("camera",20)} Photo evidence attached</div>`
            : `<div class="photo-placeholder empty">No photo attached</div>`}
        </div>

        <div class="modal-row"><span class="modal-label">Category</span><span>${cat.label}</span></div>
        <div class="modal-row">
          <span class="modal-label">Assigned to</span>
          ${role === "official"
            ? `<select class="input select-sm" onchange="App.updateReport('${report.id}', {department: this.value})">
                ${DEPARTMENTS.map(d=>`<option${d===report.department?' selected':''}>${d}</option>`).join("")}
              </select>`
            : `<span>${esc(report.department)}</span>`}
        </div>

        ${role === "official"
          ? `<div class="modal-actions">
              ${STATUS_STEPS.map(s => `<button class="btn btn-ghost sm${report.status===s?' active':''}" onclick="App.updateReport('${report.id}', {status:'${s}'})">${s}</button>`).join("")}
            </div>`
          : `<p class="muted small">Municipal officials update the status of this report as it's reviewed and addressed.</p>`}
      </div>
    </div>`;
  },

  renderLocations(){
    const byBarangay = BARANGAYS.map(b => {
      const list = this.reports.filter(r => r.barangay === b);
      return { barangay:b, total:list.length, open:list.filter(r=>r.status!=="Resolved").length };
    }).sort((a,b) => b.total - a.total);
    const max = Math.max(1, ...byBarangay.map(b=>b.total));

    return `<div class="card">
      <div class="card-header"><h3>Reports by barangay</h3><span class="muted small">${this.reports.length} total across ${BARANGAYS.length} barangays</span></div>
      <div class="loc-list">
        ${byBarangay.map(b => `
          <div class="loc-row">
            <div class="loc-name">${icon("map-pin",14)} ${b.barangay}</div>
            <div class="loc-bar-track"><div class="loc-bar-fill" style="width:${(b.total/max)*100}%"></div></div>
            <div class="loc-counts">
              <span class="loc-total">${b.total}</span>
              ${b.open > 0 ? `<span class="loc-open">${b.open} open</span>` : ""}
            </div>
          </div>`).join("")}
      </div>
    </div>`;
  },

  renderAbout(){
    const u = this.user;
    return `<div class="about-page">
      <div class="card">
        <h3>Why AcThribe exists</h3>
        <p>Mamburao has no dedicated channel for residents to report environmental hazards, flooding, illegal dumping, or damaged infrastructure like seawalls. Reports posted on social media get buried under unrelated content, leading to delayed response times and lost complaints. AcThribe gives every report a permanent place to live &mdash; tracked, assigned, and visible to the Mayor's Office until it's resolved.</p>
      </div>
      <div class="card">
        <h3>How a report moves</h3>
        <div class="flow-row">
          <div class="flow-step">${icon("plus",16)} Resident submits</div>
          ${icon("chevron-right",16,"muted")}
          <div class="flow-step">${icon("clock",16)} Reviewed &amp; assigned</div>
          ${icon("chevron-right",16,"muted")}
          <div class="flow-step">${icon("construction",16)} In progress</div>
          ${icon("chevron-right",16,"muted")}
          <div class="flow-step">${icon("check-circle",16)} Resolved</div>
        </div>
      </div>
      <div class="card">
        <h3>Signed in as</h3>
        <div class="mini-row" style="padding:0;border:none;">

            <div class="mini-title">${esc(u.name)}</div>
            <div class="mini-sub">${u.role === "official" ? "Municipal Official · " + (u.title||"") : "Resident · " + esc(u.barangay)}</div>
          </div>
        </div>
      </div>
      <p class="muted small footnote">Prototype built from the Laboratory Activity 1 project proposal for the Municipality of Mamburao, Occidental Mindoro. Data shown is stored for this demo only.</p>
    </div>`;
  },
};

/* -------------------------- motion & polish layer -------------------------- */
(function(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let lastKey = "";

  function stagger(scope){
    scope.querySelectorAll(".stat-grid,.kpi-grid,.report-cards,.triage-list,.report-mini-list,.dept-grid,.loc-list,.bar-list,.brand-points,.demo-grid").forEach(g => {
      g.classList.add("stagger");
      const base = g.classList.contains("brand-points") ? 350 : 0;
      [...g.children].forEach((c, i) => c.style.animationDelay = (base + Math.min(i, 12) * 55) + "ms");
    });
    scope.querySelectorAll(".card,.stat-card,.kpi-card,.report-card,.triage-row,.demo-card").forEach(el => el.classList.add("spot"));
  }

  function countUp(scope){
    if (reduce) return;
    scope.querySelectorAll(".stat-value,.kpi-value").forEach(el => {
      const m = el.textContent.match(/^(\d+)(.*)$/); if (!m) return;
      const to = +m[1], suf = m[2], t0 = performance.now();
      (function tick(t){
        const p = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(to * e) + suf;
        if (p < 1) requestAnimationFrame(tick);
      })(t0);
    });
  }

  // render: animate only on real page/role changes, so editing a row doesn't replay everything
  const baseRender = App.render.bind(App);
  App.render = function(){
    const key = (this.user ? this.user.role : "out") + ":" + this.page;
    const fresh = key !== lastKey; lastKey = key;
    baseRender();
    const root = document.getElementById("root");
    root.classList.toggle("no-anim", !fresh);
    stagger(root);
    if (fresh) countUp(root);
  };

  const baseRefresh = App.refreshResults.bind(App);
  App.refreshResults = function(){ baseRefresh(); const c = document.getElementById("reportsResultsContainer"); if (c) stagger(c); };

  // toasts
  App.toast = function(msg){
    let h = document.getElementById("toasts");
    if (!h){ h = document.createElement("div"); h.id = "toasts"; document.body.appendChild(h); }
    const t = document.createElement("div");
    t.className = "toast"; t.innerHTML = icon("check-circle", 16) + "<span>" + esc(msg) + "</span>";
    h.appendChild(t);
    setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 260); }, 2600);
  };
  const add = App.addReport.bind(App);
  App.addReport = async function(r){ await add(r); this.toast("Report submitted to the Mayor's Office"); };
  const upd = App.updateReport.bind(App);
  App.updateReport = async function(id, p){ await upd(id, p); this.toast(p.status ? "Status set to " + p.status : "Department updated"); };

  // modal: animated close + Esc key
  const close = App.closeModal.bind(App);
  App.closeModal = function(){
    const s = document.querySelector(".modal-scrim");
    if (!s || reduce) return close();
    s.classList.add("closing"); this.activeReportId = null;
    setTimeout(() => { if (!this.activeReportId) document.getElementById("modalContainer").innerHTML = ""; }, 170);
  };
  document.addEventListener("keydown", e => { if (e.key === "Escape" && App.activeReportId) App.closeModal(); });

  // login: shake on failure
  const lg = App.login.bind(App);
  App.login = function(e){
    lg(e);
    if (!this.user){ const f = document.querySelector(".login-form"); if (f){ f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); } }
  };

  // cursor spotlight + button ripple
  document.addEventListener("pointermove", e => {
    const c = e.target.closest && e.target.closest(".spot"); if (!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", (e.clientX - r.left) + "px"); c.style.setProperty("--my", (e.clientY - r.top) + "px");
  });
  document.addEventListener("pointerdown", e => {
    const b = e.target.closest && e.target.closest(".btn"); if (!b || reduce) return;
    const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height), d = document.createElement("span");
    d.className = "ripple";
    d.style.cssText = "width:" + s + "px;height:" + s + "px;left:" + (e.clientX - r.left - s/2) + "px;top:" + (e.clientY - r.top - s/2) + "px";
    b.appendChild(d); setTimeout(() => d.remove(), 650);
  });
})();

/* -------------- v3: themes, 3D ocean & tilt, feedback -------------- */
(function(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const KEY = "acthribe-theme", root = document.documentElement;
  ICON_PATHS.sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  ICON_PATHS.moon = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';

  /* ---- theme state: mode (light/dark/system) + accent (or sun-synced) ---- */
  let T = { mode:"system", accent:"lagoon" };
  try{ Object.assign(T, JSON.parse(localStorage.getItem(KEY) || "{}")); }catch(e){}
  const ACCENTS = [["lagoon","Lagoon","#16626D"],["mangrove","Mangrove","#1F6B47"],["bougainvillea","Bougainvillea","#9B2C72"],["dusk","Dusk","#4446A0"]];
  const SUN = { dawn:"bougainvillea", day:"lagoon", dusk:"dusk", night:"dusk" };
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const phase = () => { const h = new Date().getHours(); return h>=5&&h<8 ? "dawn" : h<16 ? "day" : h<19 ? "dusk" : "night"; };
  let oc = "79,152,160";

  /* ---- layout mode: auto (follows screen) / desktop (wide layout) / mobile (phone layout) ---- */
  let V = "auto"; try{ V = localStorage.getItem("acthribe-view") || "auto"; }catch(e){}
  const vp = document.querySelector('meta[name=viewport]');
  function setView(v){
    V = v; root.dataset.view = v;
    try{ localStorage.setItem("acthribe-view", v); }catch(e){}
    if (vp) vp.content = v === "desktop" ? "width=1280, initial-scale=1" : "width=device-width, initial-scale=1.0, viewport-fit=cover";
    paintFab();
  }

  function apply(){
    let mode = T.mode === "system" ? (dark.matches ? "dark" : "light") : T.mode, accent = T.accent, tod = "";
    if (accent === "sun"){ tod = phase(); accent = SUN[tod]; if (tod === "night" && T.mode === "system") mode = "dark"; }
    root.dataset.mode = mode; root.dataset.accent = accent;
    if (tod) root.dataset.tod = tod; else delete root.dataset.tod;
    try{ localStorage.setItem(KEY, JSON.stringify(T)); }catch(e){}
    oc = getComputedStyle(root).getPropertyValue("--ocean").trim() || oc;
    paintFab();
  }
  function change(patch, ev){
    Object.assign(T, patch);
    const x = ev ? ev.clientX : innerWidth - 40, y = ev ? ev.clientY : innerHeight - 40;
    if (document.startViewTransition && !reduce){
      const vt = document.startViewTransition(apply);   // circular reveal from the click
      vt.ready.then(() => root.animate(
        { clipPath:["circle(0px at "+x+"px "+y+"px)", "circle("+Math.hypot(innerWidth, innerHeight)+"px at "+x+"px "+y+"px)"] },
        { duration:650, easing:"cubic-bezier(.4,0,.2,1)", pseudoElement:"::view-transition-new(root)" })).catch(() => {});
    } else { root.classList.add("theme-fade"); apply(); setTimeout(() => root.classList.remove("theme-fade"), 450); }
  }

  const fab = document.createElement("button"), pop = document.createElement("div");
  fab.className = "theme-fab"; fab.setAttribute("aria-label", "Appearance and theme");
  pop.className = "theme-pop"; pop.hidden = true;
  document.body.append(fab, pop);

  function paintFab(){
    fab.innerHTML = icon(root.dataset.mode === "dark" ? "moon" : "sun", 20);
    fab.classList.remove("spin"); void fab.offsetWidth; fab.classList.add("spin");
    const seg = [["light","Light"],["dark","Dark"],["system","System"]].map(m => '<button data-mode="'+m[0]+'" aria-pressed="'+(T.mode===m[0])+'">'+m[1]+'</button>').join("");
    const sw = ACCENTS.map(a => '<button class="tp-sw" data-accent="'+a[0]+'" style="--c:'+a[2]+'" title="'+a[1]+'" aria-label="'+a[1]+'" aria-pressed="'+(T.accent===a[0])+'"></button>').join("")
      + '<button class="tp-sw sun" data-accent="sun" title="Sun-synced" aria-label="Sun-synced" aria-pressed="'+(T.accent==="sun")+'"></button>';
    const note = T.accent === "sun" ? "Sun-synced: colours follow your clock from dawn to night (now "+phase()+")." : (ACCENTS.find(a => a[0]===T.accent) || ACCENTS[0])[1];
    const vseg = [["auto","Auto"],["desktop","Desktop"],["mobile","Mobile"]].map(m => '<button data-view="'+m[0]+'" aria-pressed="'+(V===m[0])+'">'+m[1]+'</button>').join("");
    pop.innerHTML = '<p class="tp-label">Layout</p><div class="tp-seg">'+vseg+'</div><p class="tp-label">Appearance</p><div class="tp-seg">'+seg+'</div><p class="tp-label">Colour</p><div class="tp-swatches">'+sw+'</div><p class="tp-note">'+note+'</p>';
  }
  fab.addEventListener("click", () => { pop.hidden = !pop.hidden; pop.style.animation = "none"; void pop.offsetWidth; pop.style.animation = ""; });
  pop.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.view) return setView(b.dataset.view);
    if (b.dataset.mode) change({ mode:b.dataset.mode }, e); if (b.dataset.accent) change({ accent:b.dataset.accent }, e); });
  document.addEventListener("pointerdown", e => { if (!pop.hidden && !pop.contains(e.target) && !fab.contains(e.target)) pop.hidden = true; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") pop.hidden = true; });
  dark.addEventListener("change", () => { if (T.mode === "system") apply(); });
  setInterval(() => { if (T.accent === "sun") apply(); }, 60000);

  /* ---- 3D ocean: perspective wave mesh behind login + dashboard banners ---- */
  const scenes = new Set(); let raf = 0, t = 0, px = 0, py = 0, tx = 0, ty = 0;
  function mount(){
    document.querySelectorAll(".login-brand,.hero-card,.office-banner").forEach(el => {
      if (el.querySelector(":scope > .ocean3d")) return;
      const c = document.createElement("canvas"); c.className = "ocean3d"; c.setAttribute("aria-hidden", "true"); el.append(c);
      scenes.add({ c, g:c.getContext("2d"), hero:!el.classList.contains("login-brand") });
    });
    if (!raf) raf = requestAnimationFrame(frame);
  }
  function frame(){
    raf = requestAnimationFrame(frame);
    if (document.hidden) return;
    t += .012; px += (tx - px) * .06; py += (ty - py) * .06;
    scenes.forEach(s => s.c.isConnected ? draw(s) : scenes.delete(s));
    if (reduce){ cancelAnimationFrame(raf); raf = 0; }
  }
  function draw(s){
    const c = s.c, r = c.getBoundingClientRect(); if (!r.width) return;
    const d = Math.min(devicePixelRatio || 1, 2), w = Math.round(r.width*d), h = Math.round(r.height*d);
    if (c.width !== w || c.height !== h){ c.width = w; c.height = h; }
    const g = s.g, C = 34, R = 20, hz = s.hero ? .2 : .5, fy = h*(s.hero ? 1.5 : .9), fx = w*.42, amp = s.hero ? .7 : 1;
    const yaw = px*.5, cy = Math.cos(yaw), sy = Math.sin(yaw), cam = 1.1 + py*.5, pts = [];
    g.clearRect(0, 0, w, h); g.lineWidth = d;
    for (let j = 0; j <= R; j++){ const z = j/R, row = [];
      for (let i = 0; i <= C; i++){ const x = i/C*2 - 1;
        const y = amp*(Math.sin(x*2.6 + t*1.1)*.16 + Math.sin(z*7 - t*1.4 + x)*.11 + Math.sin((x+z)*4.5 + t*.7)*.06);
        const X = x*3.4, Z = z*5 + 1.2, X1 = X*cy - (Z-3)*sy, Z1 = Math.max(.3, X*sy + (Z-3)*cy + 3);
        row.push([w/2 + X1*fx/Z1, hz*h + (cam - y)*fy/Z1]); }
      pts.push(row); }
    for (let j = 0; j <= R; j++){ const z = j/R, a = (.08 + .55*(1-z)*(1-z))*(s.hero ? .8 : 1);
      g.strokeStyle = "rgba("+oc+","+a.toFixed(3)+")"; g.beginPath();
      pts[j].forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); }
    g.strokeStyle = "rgba("+oc+",.09)";
    for (let i = 0; i <= C; i += 3){ g.beginPath(); for (let j = 0; j <= R; j++) j ? g.lineTo(pts[j][i][0], pts[j][i][1]) : g.moveTo(pts[j][i][0], pts[j][i][1]); g.stroke(); }
  }

  /* ---- 3D tilt with depth on stat / KPI / demo cards ---- */
  let hot = null;
  const clear = el => { el.style.removeProperty("--rx"); el.style.removeProperty("--ry"); };
  document.addEventListener("pointermove", e => {
    tx = e.clientX/innerWidth - .5; ty = e.clientY/innerHeight - .5;
    if (reduce || e.pointerType === "touch") return;
    const c = e.target.closest && e.target.closest(".tilt");
    if (hot && hot !== c) clear(hot);
    hot = c; if (!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty("--ry", (((e.clientX - r.left)/r.width - .5)*12).toFixed(2) + "deg");
    c.style.setProperty("--rx", (-((e.clientY - r.top)/r.height - .5)*10).toFixed(2) + "deg");
  });
  document.addEventListener("pointerdown", e => {
    const c = e.target.closest && e.target.closest(".tilt"); if (c) c.style.setProperty("--s", ".97");
    if (navigator.vibrate && e.pointerType === "touch" && e.target.closest("button")) navigator.vibrate(10);
  });
  document.addEventListener("pointerup", () => document.querySelectorAll(".tilt").forEach(c => c.style.removeProperty("--s")));

  const r0 = App.render.bind(App);
  App.render = function(){ r0(); document.querySelectorAll(".stat-card,.kpi-card,.demo-card").forEach(el => el.classList.add("tilt")); mount(); };

  /* ---- feedback: typed toasts, confetti, validation, password icon ---- */
  App.toast = function(msg, type){
    let h = document.getElementById("toasts");
    if (!h){ h = document.createElement("div"); h.id = "toasts"; document.body.appendChild(h); }
    const el = document.createElement("div"); el.className = "toast" + (type === "err" ? " err" : ""); el.setAttribute("role", "status");
    el.innerHTML = icon(type === "err" ? "alert-circle" : "check-circle", 16) + "<span>" + esc(msg) + '</span><i class="toast-bar"></i>';
    h.appendChild(el); setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 260); }, 2600);
  };
  App.burst = function(x, y){
    if (reduce) return;
    const cs = getComputedStyle(root), cols = ["--teal-light","--coral","--amber","--green"].map(v => cs.getPropertyValue(v).trim());
    for (let i = 0; i < 28; i++){
      const p = document.createElement("span"), a = Math.random()*Math.PI*2, k = 60 + Math.random()*120;
      p.className = "fx";
      p.style.cssText = "left:"+x+"px;top:"+y+"px;background:"+cols[i%4]+";--dx:"+(Math.cos(a)*k).toFixed(0)+"px;--up:"+(-40 - Math.random()*90).toFixed(0)+"px;--down:"+(60 + Math.random()*120).toFixed(0)+"px;--r:"+((Math.random() - .5)*720).toFixed(0)+"deg";
      document.body.appendChild(p); setTimeout(() => p.remove(), 1100);
    }
  };
  const add = App.addReport.bind(App);
  App.addReport = async function(r){ await add(r); this.burst(innerWidth/2, innerHeight*.35); };
  const upd = App.updateReport.bind(App);
  App.updateReport = async function(id, p){ await upd(id, p); if (p.status === "Resolved") this.burst(innerWidth/2, innerHeight*.3); };
  const sub = App.submitReport.bind(App);
  App.submitReport = function(e){
    const bad = ["reportTitle","reportDesc"].map(id => document.getElementById(id)).filter(el => el && !el.value.trim());
    if (bad.length){
      e.preventDefault();
      bad.forEach(el => { el.classList.remove("invalid"); void el.offsetWidth; el.classList.add("invalid"); });
      bad[0].focus(); return this.toast("Add a title and a description to send your report", "err");
    }
    sub(e);
  };
  document.addEventListener("input", e => e.target.classList && e.target.classList.remove("invalid"));
  const tp = App.togglePw.bind(App);
  App.togglePw = function(){
    tp(); const b = document.querySelector(".pw-toggle"), i = document.getElementById("loginPassword");
    if (b && i){ b.innerHTML = icon(i.type === "text" ? "eye-off" : "eye", 16); b.firstChild.style.animation = "pop .35s var(--spring)"; }
  };

  apply();
})();

App.init();

</script>
